<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inside the Walls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- MAIN LAYOUT -->
  <main class="layout">

    <!-- MAP PANEL -->
    <div id="map-panel">

      <!-- Map title -->
      <div class="map-title">Inside the Walls</div>

      <!-- Floating instructions -->
      <div class="map-instructions">
        Click on the map or type an address to view existing reports
        or add your own housing report.
      </div>

      <!-- Leaflet map -->
      <div id="map"></div>
    </div>

    <!-- RIGHT SIDE PANEL -->
    <aside class="side-panel">

      <!-- ADDRESS SEARCH -->
      <section class="panel-section">
        <label for="addressInput">Search an address</label>

        <input
          id="addressInput"
          type="text"
          placeholder="123 Main St, Philadelphia"
        />

        <button id="searchBtn">Search</button>
        <button id="clearBtn" class="secondary-btn">Clear selection</button>
      </section>

      <!-- ADD REPORT -->
      <section class="panel-section">
        <h2>Add a Report</h2>

        <form id="reportForm">

          <!-- HVAC -->
          <select id="hvac" required>
            <option value="">HVAC present?</option>
            <option>Yes</option>
            <option>No</option>
            <option>Not sure</option>
          </select>

          <!-- HEATING -->
          <select id="heating" required>
            <option value="">Heating type</option>
            <option>Radiator</option>
            <option>Furnace</option>
            <option>Electric</option>
            <option>Other</option>
          </select>

          <!-- INSULATION -->
          <select id="insulation" required>
            <option value="">Insulation quality</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
          </select>

          <!-- MOLD -->
          <select id="mold" required>
            <option value="">Mold conditions</option>
            <option>None</option>
            <option>Suspected</option>
            <option>Visible</option>
          </select>

          <!-- STAR RATING -->
          <label class="rating-label">Overall quality</label>
          <div class="stars">
            <label><input type="radio" name="rating" value="5" /> ★★★★★</label>
            <label><input type="radio" name="rating" value="4" /> ★★★★☆</label>
            <label><input type="radio" name="rating" value="3" /> ★★★☆☆</label>
            <label><input type="radio" name="rating" value="2" /> ★★☆☆☆</label>
            <label><input type="radio" name="rating" value="1" /> ★☆☆☆☆</label>
          </div>

          <!-- COMMENTS -->
          <textarea
            id="comments"
            placeholder="Additional comments (optional)"
          ></textarea>

          <button type="submit">Submit Report</button>
        </form>

        <!-- DISCLAIMER -->
        <div class="disclaimer">
          Reports are anonymous and not verified. Information is provided
          by residents and should be used as reference only.
        </div>
      </section>

    </aside>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase + App -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>
